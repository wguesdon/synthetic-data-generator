# Made from example/descriptions/fcs_panel.md by the sdg workflow.
# Every name and number is invented.
version: 1
seed: 20261012
mode: model

design:
  subjects:
    prefix: PT-
    groups:
      treated: 10
      control: 10

datasets:
  - name: fcs
    format: fcs
    file: fcs
    events: [9000, 10000, 11000]  # assumption: about 10,000 events
    channels:
      - {name: FSC-A, range: 262144}
      - {name: SSC-A, range: 262144}
      - {name: FITC-A, label: CD3, range: 262144}
      - {name: PE-A, label: CD4, range: 262144}
      - {name: APC-A, label: CD8, range: 262144}
      - {name: Time, range: 262144}
    cofactor: 150
    populations:  # assumption: positions on the arcsinh scale were not given
      - {name: debris, weight: 0.15, means: [4.0, 3.0, 0.3, 0.3, 0.3, 0], sds: [0.8, 0.8, 0.5, 0.5, 0.5, 0]}
      - {name: non_t, weight: 0.3, means: [6.9, 5.3, 0.3, 0.4, 0.4, 0], sds: [0.3, 0.4, 0.4, 0.4, 0.4, 0]}
      - {name: cd4_t, weight: 0.33, means: [7.0, 5.5, 4.2, 4.0, 0.4, 0], sds: [0.3, 0.4, 0.4, 0.4, 0.4, 0]}
      - {name: cd8_t, weight: 0.17, means: [7.0, 5.5, 4.2, 0.4, 4.0, 0], sds: [0.3, 0.4, 0.4, 0.4, 0.4, 0]}
      - {name: double_negative_t, weight: 0.05, means: [7.0, 5.5, 4.2, 0.4, 0.4, 0], sds: [0.3, 0.4, 0.4, 0.4, 0.4, 0]}
    weight_cv: 0.25
    keywords: [cyt, op, "tube name"]

effects:
  - {dataset: fcs, feature: cd8_t, contrast: [treated, control], fold_change: 2.0}
