# Made from example/descriptions/olink_npx.md by the sdg workflow.
# Every name and number is invented, the Olink IDs and UniProt IDs too.
version: 1
seed: 20261011
mode: model

design:
  subjects:
    prefix: SUBJ-
    groups:
      treated: 12
      placebo: 8
  timepoints: [baseline, week_4]

datasets:
  - name: olink
    format: olink
    file: olink_npx.csv
    columns:
      - {name: SampleID, kind: olink, role: sample_id}
      - {name: Index, kind: olink, role: index}
      - {name: OlinkID, kind: olink, role: olink_id}
      - {name: UniProt, kind: olink, role: uniprot}
      - {name: Assay, kind: olink, role: assay}
      - {name: MissingFreq, kind: olink, role: missing_freq}
      - {name: Panel, kind: olink, role: panel}
      - {name: PlateID, kind: olink, role: plate_id}
      - {name: QC_Warning, kind: olink, role: sample_qc}
      - {name: LOD, kind: olink, role: lod}
      - {name: NPX, kind: olink, role: value}
      - {name: Normalization, kind: categorical, levels: {Intensity: 1.0}}
    plates: 2
    plate_pattern: "PLT-9"
    qc_warn_share: 0.05
    scale: log2
    decimals: 4
    assays:  # assumption: no NPX ranges were given
      - {assay: IL6, olink_id: OID00001, uniprot: P00001, panel: Inflammation, lod: 1.2, below_lod: 0.1,
         quantiles: [0.5, 1.5, 2.2, 2.8, 3.3, 3.8, 4.3, 4.9, 5.6, 6.6, 9.5]}
      - {assay: TNF, olink_id: OID00002, uniprot: P00002, panel: Inflammation, lod: 0.8, below_lod: 0.05,
         quantiles: [0.6, 1.4, 1.8, 2.1, 2.4, 2.7, 3.0, 3.3, 3.7, 4.3, 6.0]}
      - {assay: CXCL8, olink_id: OID00003, uniprot: P00003, panel: Inflammation, lod: 2.0, below_lod: 0.0,
         quantiles: [4.0, 5.5, 6.2, 6.8, 7.3, 7.8, 8.3, 8.9, 9.6, 10.6, 13.0]}
      - {assay: IL10, olink_id: OID00004, uniprot: P00004, panel: Inflammation, lod: 0.9, below_lod: 0.2,
         quantiles: [0.2, 0.7, 1.0, 1.3, 1.6, 1.9, 2.2, 2.6, 3.1, 3.9, 6.0]}

effects:
  - {dataset: olink, feature: IL6, contrast: [treated, placebo], fold_change: 2.0, timepoints: [week_4]}
