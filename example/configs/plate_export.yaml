# Made from example/descriptions/plate_export.md by the sdg workflow.
# Every name and number is invented.
version: 1
seed: 20261011
mode: resample

datasets:
  - name: plate_export
    format: csv
    file: plate_export.csv
    delimiter: ";"
    sheets:
      - name: sheet_1
        rows: 72
        empty_rows: 2
        columns:
          - name: Sample ID
            kind: identifier
            pattern: "AAA-9999"
            distinct: 24
          - name: Dilution
            kind: categorical
            levels:
              neat: 0.3334
              "1:10": 0.3333
              "1:100 ": 0.3333
          - name: OD450
            kind: numeric
            quantiles: [0.05, 0.12, 0.2, 0.31, 0.45, 0.6, 0.78, 0.95, 1.2, 1.6, 2.8]  # assumption: no range was given
            tokens: {NA: 0.1}
            decimals: 3
          - name: OD620
            kind: numeric
            quantiles: [0.03, 0.035, 0.04, 0.045, 0.05, 0.055, 0.06, 0.07, 0.08, 0.09, 0.12]  # assumption: no range was given
            tokens: {NA: 0.1}
            decimals: 3
          - name: Corrected
            kind: numeric
            quantiles: [0.01, 0.08, 0.15, 0.26, 0.4, 0.55, 0.72, 0.9, 1.1, 1.5, 2.7]  # assumption: no range was given
            tokens: {NA: 0.1}
            decimals: 3
          - name: Above blank
            kind: numeric
            quantiles: [0.0, 0.0, 0.01, 0.02, 0.04, 0.06, 0.09, 0.13, 0.2, 0.32, 0.6]  # assumption: no range was given
            exact: {0.0: 0.33}
            tokens: {NA: 0.1}
            decimals: 3
          - name: Measured
            kind: boolean
            true_share: 0.9  # assumption: no share was given
